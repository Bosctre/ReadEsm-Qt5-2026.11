		<h2>Vítejte v Readesm</h2>

<p>Readesm umí číst soubory vytvářené digitálními tachografy ve vozidlech nad 3,5&nbsp;t v Evropské unii. Tyto soubory mají přípony jako „.esm“, „.tgd“ nebo „.ddd“.</p>

<p>Začněte volbou „Soubor“ a poté „Otevřít“ v nabídce.</p>

<p>České znění vzniklo s pomocí asistenta AI; opravy jsou vítány.</p>
