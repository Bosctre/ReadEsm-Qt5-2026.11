name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt5-base
            mingw-w64-ucrt-x86_64-qt5-svg
            mingw-w64-ucrt-x86_64-qt5-tools

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Stage files (program, Qt DLLs, translations, licences)
        run: |
          mkdir -p stage/bin stage/translations stage/doc
          cp build/readesm.exe stage/bin/
          find build -name 'readesm_*.qm' -exec cp {} stage/translations/ \;
          cp COPYING stage/doc/COPYING.txt
          cp installer/THIRD-PARTY.txt stage/doc/
          WDQ=$(command -v windeployqt || command -v windeployqt-qt5 || find /ucrt64 -iname 'windeployqt*.exe' | head -n1)
          echo "windeployqt found: [$WDQ]"
          if [ -z "$WDQ" ]; then echo "--- deploy tools present ---"; find /ucrt64 -iname '*deploy*' | head -20; exit 1; fi
          "$WDQ" --release --no-translations --no-opengl-sw --no-angle --no-system-d3d-compiler stage/bin/readesm.exe
          echo "--- copying third-party DLLs from /ucrt64/bin ---"
          for i in 1 2 3; do
            for dll in $(ldd stage/bin/readesm.exe $(find stage/bin -name '*.dll') 2>/dev/null | grep -i '/ucrt64/bin' | awk '{print $3}' | sort -u); do
              cp -n "$dll" stage/bin/
            done
          done
          echo "--- DLL dependencies (informational) ---"
          ldd stage/bin/readesm.exe | grep -v -i '/c/windows' || true
          ls stage/translations

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build installer
        run: |
          VERSION=$(sed -n 's/.*set(VERSION_STRING "\(.*\)").*/\1/p' CMakeLists.txt)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          "/c/Program Files (x86)/NSIS/makensis.exe" \
            -DVERSION="$VERSION" \
            -DSTAGE="$(cygpath -w "$PWD/stage")" \
            -DOUTFILE="$(cygpath -w "$PWD/readesm-qt5_${VERSION}_windows-x64-setup.exe")" \
            "$(cygpath -w "$PWD/installer/readesm.nsi")"
          ls -l readesm-qt5_*-setup.exe

      - name: Smoke test (silent install, start the program)
        shell: pwsh
        run: |
          $setup = Get-ChildItem readesm-qt5_*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $dir = "C:\Program Files\ReadEsm-Qt5"
          if (-not (Test-Path "$dir\bin\readesm.exe")) { throw "readesm.exe not installed" }
          if (-not (Test-Path "$dir\translations\readesm_fr.qm")) { throw "translations not installed" }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process -FilePath "$dir\bin\readesm.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "readesm exited early, code $($p.ExitCode)" }
          Stop-Process -Id $p.Id
          Write-Host "Smoke test OK"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: readesm-qt5_*-setup.exe

      - name: Attach to the GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: readesm-qt5_*-setup.exe
