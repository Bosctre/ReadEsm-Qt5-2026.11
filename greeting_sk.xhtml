		<h2>Vitajte v Readesm</h2>

<p>Readesm vie čítať súbory vytvárané digitálnymi tachografmi vo vozidlách nad 3,5&nbsp;t v Európskej únii. Tieto súbory majú prípony ako „.esm“, „.tgd“ alebo „.ddd“.</p>

<p>Začnite výberom „Súbor“ a potom „Otvoriť“ v ponuke.</p>

<p>Slovenský preklad vznikol s pomocou asistenta AI; opravy sú vítané.</p>
